---
layout: default
---
<div class="reading-progress" id="reading-progress"></div>

{% unless page.hide_toc %}
<nav id="toc" class="toc">
  <ul></ul>
</nav>
{% endunless %}

<button class="back-to-top" onclick="window.scrollTo({top: 0, behavior: 'smooth'})" aria-label="Back to top"></button>

<article>
  <a href="{% if page.lang == 'zh' %}{{ '/zh/' | relative_url }}{% else %}{{ '/' | relative_url }}{% endif %}" class="post-back">&larr; {% if page.lang == 'zh' %}所有文章{% else %}All posts{% endif %}</a>
  {% unless page.hide_date %}<div class="post-eyebrow">{{ page.date | date: "%b %-d, %Y" }}</div>{% endunless %}
  <h1>{{ page.title }}</h1>
  <div class="article-content">
    {{ content }}
  </div>
</article>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    // Reading progress bar
    const progressBar = document.getElementById('reading-progress');

    function updateProgress() {
      const scrollTop = window.scrollY;
      const docHeight = document.documentElement.scrollHeight - window.innerHeight;
      const progress = docHeight > 0 ? (scrollTop / docHeight) * 100 : 0;
      progressBar.style.width = progress + '%';
    }

    // Back to top button visibility
    const backToTop = document.querySelector('.back-to-top');
    if (backToTop) {
      window.addEventListener('scroll', function() {
        if (window.scrollY > 300) {
          backToTop.classList.add('visible');
        } else {
          backToTop.classList.remove('visible');
        }
      });
    }

    // TOC functionality
    const content = document.querySelector('.article-content');
    const tocNav = document.getElementById('toc');
    const toc = document.querySelector('#toc ul');
    const headings = content.querySelectorAll('h1, h2, h3');

    if (!toc || headings.length === 0) {
      if (tocNav) tocNav.style.display = 'none';
      window.addEventListener('scroll', updateProgress);
      updateProgress();
      return;
    }

    const headingsList = [];
    let tocUserInteracting = false;
    let tocInteractionTimeout = null;

    headings.forEach((heading, index) => {
      const id = heading.id || 'heading-' + index;
      heading.id = id;
      headingsList.push({ id, element: heading });

      const li = document.createElement('li');
      li.className = 'toc-' + heading.tagName.toLowerCase();

      const a = document.createElement('a');
      a.href = '#' + id;
      a.textContent = heading.textContent;

      li.appendChild(a);
      toc.appendChild(li);
    });

    // Detect manual TOC interaction (mouse/touch only, not programmatic scroll)
    if (tocNav) {
      tocNav.addEventListener('mouseenter', function() {
        tocUserInteracting = true;
        clearTimeout(tocInteractionTimeout);
      });

      tocNav.addEventListener('mouseleave', function() {
        tocInteractionTimeout = setTimeout(() => {
          tocUserInteracting = false;
        }, 1000);
      });

      tocNav.addEventListener('touchstart', function() {
        tocUserInteracting = true;
        clearTimeout(tocInteractionTimeout);
      }, { passive: true });

      tocNav.addEventListener('touchend', function() {
        tocInteractionTimeout = setTimeout(() => {
          tocUserInteracting = false;
        }, 1000);
      }, { passive: true });
    }

    function updateActiveHeading() {
      const scrollPos = window.scrollY + 100;
      let currentId = headingsList[0]?.id;

      for (const { id, element } of headingsList) {
        if (element.offsetTop <= scrollPos) {
          currentId = id;
        }
      }

      const tocLinks = document.querySelectorAll('#toc a');
      let activeLink = null;

      tocLinks.forEach(a => {
        const isActive = a.getAttribute('href') === '#' + currentId;
        a.classList.toggle('active', isActive);
        if (isActive) activeLink = a;
      });

      // Auto-scroll TOC to keep active item visible (unless user is interacting with TOC)
      if (activeLink && tocNav && !tocUserInteracting) {
        const li = activeLink.parentElement;
        const liRect = li.getBoundingClientRect();
        const tocRect = tocNav.getBoundingClientRect();

        // Check if link is outside visible area of TOC
        const buffer = 30;
        if (liRect.top < tocRect.top + buffer) {
          // Link is above visible area
          const scrollAmount = tocRect.top - liRect.top + buffer;
          tocNav.scrollTo({ top: tocNav.scrollTop - scrollAmount, behavior: 'smooth' });
        } else if (liRect.bottom > tocRect.bottom - buffer) {
          // Link is below visible area
          const scrollAmount = liRect.bottom - tocRect.bottom + buffer;
          tocNav.scrollTo({ top: tocNav.scrollTop + scrollAmount, behavior: 'smooth' });
        }
      }
    }

    window.addEventListener('scroll', function() {
      updateProgress();
      updateActiveHeading();
    }, { passive: true });

    updateProgress();
    updateActiveHeading();

    // Highlight heading when TOC link is clicked
    document.querySelectorAll('#toc a').forEach(link => {
      link.addEventListener('click', function(e) {
        const targetId = this.getAttribute('href').slice(1);
        const targetHeading = document.getElementById(targetId);
        if (targetHeading) {
          targetHeading.classList.add('heading-highlight');
          setTimeout(() => {
            targetHeading.classList.remove('heading-highlight');
          }, 1500);
        }
      });
    });
  });
</script>
