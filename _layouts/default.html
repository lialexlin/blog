<!DOCTYPE html>
<html lang="{% if page.lang == 'zh' %}zh-Hant{% else %}en{% endif %}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: site.title }}</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%231c2b4a'/><text x='50' y='70' font-size='58' font-family='system-ui, sans-serif' font-weight='600' text-anchor='middle' fill='white'>L</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  {% if page.lang == 'zh' %}
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
  {% else %}
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  {% endif %}
  <link rel="stylesheet" href="{{ '/styles.css' | relative_url }}?v={{ site.time | date: '%s' }}">
</head>
<body>
  <header class="site-nav">
    <div class="site-nav__inner">
      {% if page.lang == 'zh' %}
      <a href="{{ '/zh/' | relative_url }}" class="wordmark">lialexlin</a>
      <nav class="site-nav__links">
        <a href="{{ '/zh/' | relative_url }}"{% if page.url == '/zh/' %} class="active"{% endif %}>文章</a>
        <a href="{{ '/zh/about-me' | relative_url }}"{% if page.url contains 'about-me' %} class="active"{% endif %}>關於我</a>
        <a href="{{ '/' | relative_url }}" class="lang-toggle">EN</a>
      </nav>
      {% else %}
      <a href="{{ '/' | relative_url }}" class="wordmark">lialexlin</a>
      <nav class="site-nav__links">
        <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} class="active"{% endif %}>Writing</a>
        <a href="{{ 'about-me' | relative_url }}"{% if page.url contains 'about-me' %} class="active"{% endif %}>About</a>
      </nav>
      {% endif %}
    </div>
  </header>
  <main>
    {{ content }}
  </main>
  <footer class="site-footer">
    <div class="site-footer__inner">
      <span class="wordmark">lialexlin</span>
      <span class="site-footer__copy">© {{ site.time | date: '%Y' }}</span>
      <nav class="site-footer__links">
        <a href="mailto:li.alex.lin@gmail.com">Email</a>
        <a href="https://x.com/lialexlin" target="_blank" rel="noopener" aria-label="X (Twitter)">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
        </a>
      </nav>
    </div>
  </footer>
</body>
</html>
